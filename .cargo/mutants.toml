# cargo-mutants 27.1.0: `cargo mutants` in the directory of the crate, or the Mutants
# workflow, which runs it in shards.
#
# Every feature, so that the tree, the node and the endpoint are mutated and the
# tests of each of them run. The bodies of the macros of src/macros.rs, which write the
# codec of each layout, are not mutated: cargo-mutants leaves `macro_rules!` alone.
all_features = true

# Mutants that no test can tell from the code, each with why.
exclude_re = [
    # The two values of disjoint bits of an octet that together joins: the fields of a
    # header, refused first when wider than their bits, a Narrow value and its spare bits,
    # an Address Type and its length, the Node-ID Type and the CSIDs of an FQ-CSID, whose
    # | and ^ write alike.
    'src/octets\.rs:\d+:\d+: replace \| with \^ in together$',
    # The rules of a value that has none, the default of the trait: its body does nothing
    # already.
    'src/check\.rs:\d+:\d+: replace Rules::check with \(\)$',
    # The deviations of a value itself are given their IE type and Cause when there are
    # some: with none, the call does nothing but write the path, which the guard spares.
    'src/check\.rs:\d+:\d+: replace > with >= in check_field$',
    # The node forgets the request of a dropped Incoming only while it waits for its
    # answer (Node::forget): once answered, the Forget that the drop sends changes
    # nothing, which the flag spares.
    'src/endpoint\.rs:\d+:\d+: replace \|= with &= in Incoming::respond_message$',
    # The Debug of a command of the task, which the channel requires and prints never:
    # tokio's channels show none of what they carry.
    'src/endpoint\.rs:\d+:\d+: replace <impl core::fmt::Debug for Command>::fmt -> core::fmt::Result with Ok\(Default::default\(\)\)$',
    # oxirush-utils reads a PLMN of its canonical octets alone (a filler of F, digits of
    # 0 to 9), which it writes back the same: the guard keeps a tree byte for byte, should
    # it read others.
    'src/fields\.rs:\d+:\d+: replace match guard plmn\.to_nas_octets\(\) == self\.0 with true in <impl Field for PlmnId>::to_tree$',
    # No octets are no octets of any representation: an empty list of octets on the heap
    # allocates nothing either, and reads as the same slice.
    'src/octets\.rs:\d+:\d+: delete match arm 0 in Octets::copied$',
    # An Endpoint on a socket of IPv6 sends to an IPv4 peer at its IPv4-mapped address, which
    # macOS and the BSDs need; Linux, where the mutants run, takes the IPv4 address on such a
    # socket as well. The test an_endpoint_of_both_families_reaches_an_ipv4_peer fails
    # without the guard on macOS, and on Linux under a shim that refuses an IPv4 address on
    # a socket of IPv6 as macOS does.
    'src/endpoint\.rs:\d+:\d+: replace match guard self\.ipv6 with false in Task::flush$',
    # The rules of a value in its table that has none, the default of the trait: its body
    # does nothing already.
    'src/check\.rs:\d+:\d+: replace Rules::check_placed with \(\)$',
    # A row of one role, as most are, is answered by its role alone, the short way: without
    # the arm, the walk of the roles of any row gives the same of one role, which the test
    # a_row_of_one_role_is_on_each_set_of_interfaces_as_its_roles_say compares.
    'src/table\.rs:\d+:\d+: replace match guard role\.interfaces\.has\(interfaces\) with false in Row::on$',
    # The sets of interfaces `SXA_SXB` and `ALL` are of interfaces of one bit each, which
    # | and ^ join alike: a constant, of no function.
    'src/table\.rs:\d+:\d+: replace \| with \^$',
    # A row there once whose first IE is its value is noted as one whose first IE is kept
    # as octets: the next IE of the row is then repeated without asking the scope, which
    # has the value and answers that it is repeated too. An IE of no row is of no row
    # there once, and one repeated is of a row noted or filled already.
    'src/table\.rs:\d+:\d+: replace unread -> bool with true$',
]
