# The measurements of oxirush-pfcp. A package of its own, so that the crate keeps its
# few dependencies: nothing here is published.
[package]
name = "oxirush-pfcp-benches"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[features]
# Count the allocations with dhat in place of measuring.
heap = ["dep:dhat"]
# The workloads of the trees.
tree = ["oxirush-pfcp/tree"]

[dependencies]
oxirush-pfcp = { path = ".." }
hex = "0.4"
dhat = { version = "0.3", optional = true }

[profile.release]
debug = false
codegen-units = 1

# tree::Takes of oxirush-utils, its trees that hold the names of the crate without copying
# them, and its fields are not released yet: every crate of the build takes oxirush-utils
# from this revision until its next release.
[patch.crates-io]
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "afeef3376716bb29ac8d3972755a71477281ff6c" }
