# The measurements of oxirush-pfcp. A package of its own, so that the crate keeps its
# few dependencies: nothing here is published.
[package]
name = "oxirush-pfcp-benches"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[features]
# Count the allocations with dhat in place of measuring.
heap = ["dep:dhat"]
# The workloads of the trees.
tree = ["oxirush-pfcp/tree"]

[dependencies]
oxirush-pfcp = { path = ".." }
hex = "0.4"
dhat = { version = "0.3", optional = true }

[profile.release]
debug = false
codegen-units = 1

# tree::Takes of oxirush-utils is not released yet: every crate of the build takes
# oxirush-utils from this revision until its next release.
[patch.crates-io]
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "1a15076068b91a67a3e74b2b3cd01c5482765f11" }
