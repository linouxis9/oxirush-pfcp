[package]
name = "oxirush-pfcp"
version = "0.0.0"
edition = "2024"
description = "PFCP (3GPP TS 29.244, Release 19) in Rust: decode, build, check and encode every message and IE of N4, Sxa, Sxb and Sxc, and edit them as JSON. no_std."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-pfcp"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["pfcp", "5g", "lte", "n4", "3gpp"]
categories = ["network-programming", "encoding", "parser-implementations", "no-std"]
readme = "README.md"
publish = false

# The crate builds alone, outside any workspace that it sits in.
[workspace]

[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs an allocator.
std = []
# The tree of a message, its paths and its edits, on the engine of oxirush-utils.
tree = ["oxirush-utils/tree"]
# `Serialize` and `Deserialize` for a message and each of its IEs, through its tree.
serde = ["tree", "oxirush-utils/serde"]
# A PFCP entity without I/O: delivery, heartbeat, associations, sessions, load and
# overload control.
node = []

[dependencies]
pastey = "0.2"
oxirush-utils = { version = "0.1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"

[[test]]
name = "spike"
required-features = ["tree"]

[[test]]
name = "spec"

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "node"
required-features = ["node"]

# `pfcp_borrowed`: decoded values borrow their octets, for the measurement of the two
# forms. cargo-fuzz sets `fuzzing`, and docs.rs `docsrs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pfcp_borrowed)', 'cfg(fuzzing)', 'cfg(docsrs)'] }
