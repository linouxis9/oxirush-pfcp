[package]
name = "oxirush-pfcp"
version = "0.1.0"
edition = "2024"
description = "PFCP (3GPP TS 29.244, Release 19) in Rust: decode, build, check and encode every message and IE of N4, N4mb, Sxa, Sxb and Sxc, and edit them as JSON. no_std."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-pfcp"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["pfcp", "5g", "lte", "n4", "3gpp"]
categories = ["network-programming", "encoding", "parser-implementations", "no-std"]
readme = "README.md"
publish = false
# Anchored to the root: an unanchored name is a gitignore glob, which matches a file of
# that name in any directory. tests/README.md, which tests/spec.rs and tests/codec.rs
# read, is named, and so are the scripts under tests/ that it names.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/**/*.tsv",
    "/tests/**/*.py",
    "/tests/README.md",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
]

# The crate is `no_std` and needs an allocator, but with `endpoint`.
[features]
# The tree of a message, its paths and its edits, on the engine of oxirush-utils.
tree = ["oxirush-utils/tree"]
# `Serialize` and `Deserialize` for a message and each of its IEs, through its tree.
serde = ["tree", "oxirush-utils/serde"]
# A PFCP entity without I/O: delivery, heartbeat, associations, sessions, load and
# overload control.
node = []
# A node on a Tokio UDP socket, run by a task of its own.
endpoint = ["node", "dep:tokio"]
# The layout of each value as the crate reads it, which the test `spec` compares with the
# figures of the document: for that test alone.
spec = []

[dependencies]
pastey = "0.2"
tokio = { version = "1.38", features = ["macros", "net", "rt", "sync", "time"], optional = true }
oxirush-utils = { version = "0.1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
hex = "0.4.3"
tokio = { version = "1.38", features = ["macros", "net", "rt", "sync", "time"] }
serde_json = "1.0.154"

[[test]]
name = "codec"
required-features = ["tree"]

[[test]]
name = "captures"
required-features = ["tree"]

[[test]]
name = "spec"
required-features = ["spec"]

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "node"
required-features = ["node"]

[[test]]
name = "endpoint"
required-features = ["endpoint"]

[[test]]
name = "allocation"
required-features = ["node"]

# The Rust blocks of README.md, which tests/readme.rs runs.
[[test]]
name = "readme"
required-features = ["serde", "endpoint"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# docs.rs sets `docsrs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
