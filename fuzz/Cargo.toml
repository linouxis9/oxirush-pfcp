# The fuzz targets of oxirush-pfcp, for cargo-fuzz: `cargo +nightly fuzz run decode`.
# A package of its own, which is not published.
[package]
name = "oxirush-pfcp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"

[dependencies.oxirush-pfcp]
path = ".."
features = ["tree", "node", "endpoint"]

[dependencies.tokio]
version = "1.38"
features = ["macros", "net", "rt", "sync", "time"]

# Not part of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree"
path = "fuzz_targets/tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "node"
path = "fuzz_targets/node.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit"
path = "fuzz_targets/edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint"
path = "fuzz_targets/endpoint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

# tree::Takes of oxirush-utils, its trees that hold the names of the crate without copying
# them, and its fields are not released yet: every crate of the build takes oxirush-utils
# from this revision until its next release.
[patch.crates-io]
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "5d22965aee97b66f962dcc72d7fbbd2d682c0a7f" }
