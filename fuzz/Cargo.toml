# The fuzz targets of oxirush-pfcp, for cargo-fuzz: `cargo +nightly fuzz run decode`.
# A package of its own, which is not published.
[package]
name = "oxirush-pfcp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"

[dependencies.oxirush-pfcp]
path = ".."
features = ["tree", "node"]

# Not part of any parent workspace.
# A codec of PFCP written apart from this crate (Apache-2.0), which only the differential
# target builds: `cargo fuzz run differential --features differential`.
[dependencies.rs-pfcp]
version = "=0.5.0"
optional = true

[features]
differential = ["dep:rs-pfcp"]

[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree"
path = "fuzz_targets/tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "node"
path = "fuzz_targets/node.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit"
path = "fuzz_targets/edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
required-features = ["differential"]
test = false
doc = false
bench = false
