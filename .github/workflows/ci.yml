name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each set of features: all, the default (`std`), and none
      - run: cargo test --all-features
      - run: cargo test
      - run: cargo test --no-default-features

  # Targets without the standard library: the crate and each set of features
  # that is `no_std` build there.
  no-std:
    name: Build without std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, aarch64-unknown-none]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target ${{ matrix.target }} --no-default-features
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features node
      - run: cargo build --target ${{ matrix.target }} --no-default-features --features serde,node

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo build --no-default-features --features node

  lint:
    name: Format, Clippy and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  benches:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benches
      - run: cargo build --release --manifest-path benches/Cargo.toml --features tree

  # tests/readme.rs is the test of the blocks of README.md that the README tool of
  # oxirush-aper writes, at this revision: it must be the one of the README.
  readme:
    name: The test of the README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: crate
      - uses: actions/checkout@v4
        with:
          repository: linouxis9/oxirush-aper
          ref: 478c2c2f673b374cb15c139c212c0b5a23881f38
          path: oxirush-aper
      - run: python3 ../oxirush-aper/protocols/tests/readme.py --check
        working-directory: crate

  # The fixtures of the test `spec`, as tests/spec/extract.py writes them from the
  # document in the 3GPP archive, whose SHA-256 it checks.
  fixtures:
    name: The fixtures of the specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/spec/extract.py --fetch
      - run: git diff --exit-code tests/spec

  # The changes of tests/spec/mutations.tsv, each of which the test `spec` must fail on.
  mutations:
    name: The test of the specification fails on what differs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 tests/spec/mutate.py

  # The test vectors of go-pfcp, at the version that tests/README.md names: each decodes,
  # encodes back to its octets, and reads back from its tree, and check() finds in them
  # what tests/go-pfcp-deviations.tsv lists.
  vectors:
    name: The vectors of go-pfcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          dir=$(go mod download -json github.com/wmnsk/go-pfcp@v0.0.24 | python3 -c 'import json, sys; print(json.load(sys.stdin)["Dir"])')
          python3 tests/go-pfcp-vectors.py "$dir" "$RUNNER_TEMP/vectors.tsv"
          PFCP_VECTORS="$RUNNER_TEMP/vectors.tsv" cargo test --all-features --test codec other_vectors -- --ignored --nocapture

  fuzz:
    name: Fuzz (a minute each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      # From the seeds of fuzz/seeds: the captured messages, and for the node each of
      # them delivered to the SMF and the UPF.
      - run: |
          for target in decode tree node; do
            seeds=messages
            [ "$target" = node ] && seeds=node
            mkdir -p "fuzz/corpus/$target"
            cp fuzz/seeds/$seeds/* "fuzz/corpus/$target/"
            cargo fuzz run "$target" -- -max_total_time=60
          done
      # The input that failed, to reproduce it: `cargo fuzz run TARGET FILE`
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
