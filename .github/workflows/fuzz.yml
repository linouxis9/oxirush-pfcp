name: Fuzz

# The fuzz targets of fuzz/, longer than the minute that each has at a push: the jobs of
# crate-fuzz.yml of oxirush-aper, which every crate of the family calls. An hour for
# each target every day but Friday and Sunday, from 13:13 UTC, one target at a time, and
# four hours for each on Friday, two at a time, less when the fuzzing of a run would not
# end within the eight hours that crate-fuzz.yml gives it; the crates of the family fuzz
# each at an hour of its own, with few jobs at once, and each has a day of its own for
# its long run, so that what they run at once leaves runners to the other CI (GitHub
# starts a scheduled run hours after its time, in their order). The corpus of each
# target is kept from one run to the next in the cache of the repository, and grows. On
# Friday, and when `weekly` is set by hand, each corpus is minimized and its coverage
# kept for 30 days. A crash or a timeout fails the job, which keeps the input and the
# log: the input goes into the seeds with its fix.
on:
  schedule:
    - cron: "13 13 * * 1-4,6"
    - cron: "13 13 * * 5"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes for each target
        type: number
        default: 60
      weekly:
        description: Minimize each corpus and report its coverage, as on Friday
        type: boolean
        default: false

# A run is never cancelled by another: a newer one waits until it ends.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# The plan reads the runs of the workflow, to find where the last one ended.
permissions:
  actions: read
  contents: read

# A dispatch gives its minutes as text, which fromJSON makes the number that the called
# workflow takes, as it does the boolean of `weekly`; a schedule gives neither.
jobs:
  fuzz:
    uses: linouxis9/oxirush-aper/.github/workflows/crate-fuzz.yml@7ff6f4df878d24cb90b62059144e728ca30beac2
    with:
      weekly: "13 13 * * 5"
      minutes: ${{ fromJSON(inputs.minutes || '0') }}
      report: ${{ fromJSON(inputs.weekly || 'false') }}
      weekly-parallel: 2
      coverage-ignore: '/\.cargo/registry/|/rustc/|/fuzz/fuzz_targets/'
      # The targets that read octets start from the captured messages, the node from
      # each of them delivered to the SMF and the UPF; those that build their input with
      # `arbitrary` from the messages of tests/captures, or of an IE of any row,
      # themselves. `differential` compares the crate with rs-pfcp 0.5.0 on the same
      # octets: the messages that each decodes or refuses, the header, the IEs at every
      # level of the grouped IEs and the values of ten IE types, each difference one of
      # the readings of rs-pfcp that fuzz_targets/readings.rs names.
      targets: >-
        [{"target": "decode", "seeds": "fuzz/seeds/messages"},
         {"target": "tree", "seeds": "fuzz/seeds/messages"},
         {"target": "node", "seeds": "fuzz/seeds/node"},
         {"target": "paths"},
         {"target": "edit"},
         {"target": "endpoint"},
         {"target": "check", "seeds": "fuzz/seeds/messages"},
         {"target": "differential", "seeds": "fuzz/seeds/messages", "features": "differential"}]
